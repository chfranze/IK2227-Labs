apiVersion: apps/v1
kind: Deployment
metadata:
  name: worddb-dply
  namespace: word-ns
spec:
  selector:
    matchLabels:
      app: worddb
  replicas: 1
  template:
    metadata:
      labels:
        app: worddb
    spec:
      containers:
        - name: worddb-container
          image: postgres
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: worddb
            - name: POSTGRES_USER
              value: root
            - name: POSTGRES_PASSWORD
              value: root
          volumeMounts:
            - name: worddb-storage
              mountPath: /var/lib/postgresql/pgdata
      volumes:
        - name: worddb-storage
          persistentVolumeClaim:
            claimName: worddb-pvc
---
