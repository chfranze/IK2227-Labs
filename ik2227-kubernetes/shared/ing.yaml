apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: word-ing
  namespace: word-ns
spec:
  ingressClassName: nginx
  rules:
  - host: datacenter.com
    http:
      paths:
      - pathType: Prefix
        path: /word
        backend:
          service:
            name: word
            port:
              number: 5001
---
